name: Update filtered Mihon repo

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout repo branch
        uses: actions/checkout@v4
        with:
          ref: repo
          path: repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install protobuf
        run: pip install protobuf

      - name: Download protobuf definition
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/keiyoushi/extensions-source/main/.github/scripts/index_pb2.py \
            -o index_pb2.py

      - name: Filter index
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python <<'PY'
          import gzip
          import json
          import os
          import urllib.request

          from google.protobuf import json_format
          import index_pb2

          UPSTREAM_INDEX = (
              "https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.json"
          )

          ALLOWED_EXTENSIONS = {
              "eu.kanade.tachiyomi.extension.en.mangahere",
              "eu.kanade.tachiyomi.extension.all.mangataro",
          }

          with urllib.request.urlopen(UPSTREAM_INDEX) as response:
              data = json.load(response)

          extensions = data["extensionList"]["extensions"]

          filtered = [
              ext
              for ext in extensions
              if ext["packageName"] in ALLOWED_EXTENSIONS
          ]

          data["extensionList"]["extensions"] = filtered

          repo_dir = "repo"

          with open(f"{repo_dir}/index.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")

          index = json_format.Parse(
              json.dumps(data),
              index_pb2.Index(),
          )

          with open(f"{repo_dir}/index.pb", "wb") as f:
              f.write(
                  gzip.compress(
                      index.SerializeToString(deterministic=True),
                      mtime=0,
                  )
              )

          repo_json_path = f"{repo_dir}/repo.json"

          with open(repo_json_path, "r", encoding="utf-8") as f:
              repo_json = json.load(f)

          repo_json["index_v2"] = (
              f"https://raw.githubusercontent.com/"
              f"{os.environ['GITHUB_REPOSITORY']}/repo/index.pb"
          )

          with open(repo_json_path, "w", encoding="utf-8") as f:
              json.dump(repo_json, f, indent=2)
              f.write("\n")

          print(f"Found {len(extensions)} extensions upstream")
          print(f"Keeping {len(filtered)} extensions:")

          for ext in filtered:
              print(f"  - {ext['name']}")
          PY

      - name: Commit changes
        run: |
          cd repo

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.json index.pb repo.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update filtered extensions"
            git push origin repo
          fi
